<rect width="640" height="640" fill="url(#bg)"/><circle cx="540" cy="80" r="150" fill="#6f3cc3" opacity=".08"/>
<text x="50" y="65" fill="#bd9bff" font-family="system-ui,sans-serif" font-size="14" font-weight="700" letter-spacing="2">OPENROUTER · MODEL LIFETIME</text>
<text x="48" y="124" fill="#eaf2ff" font-family="system-ui,sans-serif" font-size="39" font-weight="700">How long does</text><text x="48" y="173" fill="#69d9e8" font-family="system-ui,sans-serif" font-size="39" font-weight="700">popular last?</text>

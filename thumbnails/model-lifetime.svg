<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
<title id="title">Lifetime of a model</title><desc id="desc">A conceptual declining model-popularity curve above an accumulating inference-demand curve. Observed history and future scenarios are separated by a dotted line.</desc>
